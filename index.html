<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ruta Mapa | Reconstructor Geocronológico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header id="topbar">
    <div class="brand">
      <strong>RUTA MAPA</strong>
      <span>Reconstructor Geocronológico</span>
    </div>

    <div class="top-actions">
      <button id="btnNuevo">Nuevo</button>
      <button id="btnGuardar">Guardar</button>
      <button id="btnPlay">▶ Reproducir</button>
    </div>
  </header>

  <main id="workspace">
    <aside id="panelIzquierdo">
      <h3>Herramientas</h3>

      <button id="toolTramo">🖊 Nuevo tramo</button>
      <button id="toolParada">📍 Agregar parada</button>
      <button id="toolLetrero">📋 Letrero</button>

      <hr />

      <label>Participantes</label>
      <div class="checks">
        <label><input type="checkbox" value="Sujeto 1" checked> Sujeto 1</label>
        <label><input type="checkbox" value="Sujeto 2"> Sujeto 2</label>
        <label><input type="checkbox" value="Sujeto 3"> Sujeto 3</label>
        <label><input type="checkbox" value="Sujeto 4"> Sujeto 4</label>
      </div>

      <label>Movilidad</label>
      <select id="movilidad">
        <option value="caminando">🚶 Caminando</option>
        <option value="automovil">🚗 Automóvil</option>
        <option value="moto">🏍 Moto</option>
        <option value="bicicleta">🚲 Bicicleta</option>
        <option value="bus">🚌 Bus</option>
        <option value="taxi">🚕 Taxi</option>
        <option value="metro">🚇 Metro</option>
      </select>

      <label>Color del tramo</label>
      <input id="colorTramo" type="color" value="#d71920" />

      <label>Referencia horaria</label>
      <select id="referenciaHoraria">
        <option value="Hora Oficial">Hora Oficial</option>
        <option value="Hora Monitor">Hora Monitor</option>
      </select>

      <label>Hora inicio</label>
      <input id="horaInicio" type="time" step="1" value="08:00:00" />

      <label>Hora término</label>
      <input id="horaTermino" type="time" step="1" value="08:10:00" />

      <label>Duración en video (segundos)</label>
      <input id="duracionVideo" type="number" min="1" value="12" />

      <label>Título</label>
      <input id="tituloTramo" type="text" value="Nuevo tramo" />

      <label>Descripción</label>
      <textarea id="descripcionTramo">Desplazamiento registrado en la cronología investigativa.</textarea>

      <button id="btnIniciarDibujo">Iniciar dibujo</button>
      <button id="btnFinalizarDibujo">Finalizar tramo</button>
      <button id="btnDeshacerPunto">Deshacer punto</button>      
    </aside>

    <section id="map"></section>

    <aside id="panelDerecho">
      <h3>Cronología</h3>
      <div id="listaCronologia"></div>
    </aside>
  </main>

  <div id="popupEvento" class="oculto">
    <h2 id="popupTitulo"></h2>
    <p id="popupDescripcion"></p>
    <span id="popupHora"></span>
  </div>

  <div id="firma">TEC. FORENSE - DEPTO. OS-9</div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/mapa.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tramos.js"></script>
  <script src="js/camara.js"></script>
  <script src="js/reproductor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
